[package]
name = "lanch"
version = "0.1.0"
description = "tui launcher"
authors = ["Wiss <97359397+Zonord@users.noreply.github.com>"]
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
freedesktop-desktop-entry = "0.8.3"
libc = "0.2.189"
ratatui = "0.30.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
